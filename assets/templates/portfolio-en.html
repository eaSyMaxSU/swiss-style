<!DOCTYPE html>
<!-- PORTFOLIO · EN · Replace a geometric block with img.photo only when a black-and-white photograph exists. Keep the same s and w classes. Copy this file and swiss.css into the working directory. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{DOC_TITLE}}</title>
<meta name="author" content="{{AUTHOR}}">
<meta name="description" content="{{DESCRIPTION}}">
<meta name="keywords" content="{{KEYWORDS}}">
<meta name="generator" content="Swiss Style">
<link rel="stylesheet" href="swiss.css">
</head>
<body>

<header class="g">
  <p class="s1 w2 index red">01</p>
  <p class="s9 w4 meta">{{PLACE}}<br>{{YEAR}}</p>
  <h1 class="s1 w8 display mt-2">{{NAME}}</h1>
  <p class="s1 w6 lead mt-2">{{INTRO}}</p>
</header>
<article class="g band">
  <p class="s1 w2 index">02</p>
  <h2 class="s1 w6 display m">{{CASE_1}}</h2>
  <p class="s8 w5 meta">{{CASE_1_YEAR}}<br>{{CASE_1_PLACE}}</p>
  <div class="s1 w7 bg-ink h-l mt-2"></div>
  <p class="s9 w4 mt-2">{{CASE_1_BODY}}</p>
</article>
<article class="g band">
  <p class="s1 w2 index">03</p>
  <h2 class="s1 w7 display m">{{CASE_2}}</h2>
  <p class="s9 w4 meta">{{CASE_2_YEAR}}<br>{{CASE_2_PLACE}}</p>
  <p class="s1 w4 mt-2">{{CASE_2_BODY}}</p>
  <div class="s6 w7 bg-red h-l mt-2"></div>
</article>
<article class="g band">
  <p class="s1 w2 index">04</p>
  <h2 class="s1 w6 display m">{{CASE_3}}</h2>
  <p class="s8 w5 meta">{{CASE_3_YEAR}}<br>{{CASE_3_PLACE}}</p>
  <div class="s1 w5 bg-ink h-m mt-2"></div>
  <p class="s7 w5 mt-2">{{CASE_3_BODY}}</p>
</article>

</body>
</html>

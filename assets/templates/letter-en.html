<!DOCTYPE html>
<!-- LETTER · EN · 1 page. Body stays in seven columns. Copy this file and swiss.css into the working directory. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{DOC_TITLE}}</title>
<meta name="author" content="{{AUTHOR}}">
<meta name="description" content="{{DESCRIPTION}}">
<meta name="keywords" content="{{KEYWORDS}}">
<meta name="generator" content="Swiss Style">
<link rel="stylesheet" href="swiss.css">
</head>
<body>

<header class="g">
  <p class="s1 w4 meta">{{SENDER}}<br>{{SENDER_CONTACT}}</p>
  <p class="s8 w5 meta">{{PLACE}}<br>{{DATE}}</p>
  <h1 class="s1 w8 display m mt-3">{{RECIPIENT}}</h1>
  <p class="s1 w7 heading mt-1">{{SUBJECT}}</p>
</header>
<div class="g mt-3">
  <p class="s1 w7">{{PARAGRAPH_1}}</p>
  <p class="s1 w7 mt-1">{{PARAGRAPH_2}}</p>
  <p class="s1 w7 mt-1">{{PARAGRAPH_3}}</p>
</div>
<div class="g mt-4">
  <p class="s1 w4">{{CLOSE}}</p>
  <p class="s1 w5 heading mt-2">{{SENDER}}</p>
</div>

</body>
</html>

<!DOCTYPE html>
<!-- PORTFOLIO · ZH · 有黑白照片时，用 img.photo 替换几何块，保留原来的栏位。 Copy this file and swiss.css into the working directory. -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>{{文档标题}}</title>
<meta name="author" content="{{作者}}">
<meta name="description" content="{{摘要}}">
<meta name="keywords" content="{{关键词}}">
<meta name="generator" content="Swiss Style">
<link rel="stylesheet" href="swiss.css">
</head>
<body>

<header class="g">
  <p class="s1 w2 index red">01</p>
  <p class="s9 w4 meta">{{地点}}<br>{{年份}}</p>
  <h1 class="s1 w8 display mt-2">{{名称}}</h1>
  <p class="s1 w6 lead mt-2">{{引言}}</p>
</header>
<article class="g band">
  <p class="s1 w2 index">02</p>
  <h2 class="s1 w6 display m">{{作品一}}</h2>
  <p class="s8 w5 meta">{{作品一年份}}<br>{{作品一地点}}</p>
  <div class="s1 w7 bg-ink h-l mt-2"></div>
  <p class="s9 w4 mt-2">{{作品一正文}}</p>
</article>
<article class="g band">
  <p class="s1 w2 index">03</p>
  <h2 class="s1 w7 display m">{{作品二}}</h2>
  <p class="s9 w4 meta">{{作品二年份}}<br>{{作品二地点}}</p>
  <p class="s1 w4 mt-2">{{作品二正文}}</p>
  <div class="s6 w7 bg-red h-l mt-2"></div>
</article>
<article class="g band">
  <p class="s1 w2 index">04</p>
  <h2 class="s1 w6 display m">{{作品三}}</h2>
  <p class="s8 w5 meta">{{作品三年份}}<br>{{作品三地点}}</p>
  <div class="s1 w5 bg-ink h-m mt-2"></div>
  <p class="s7 w5 mt-2">{{作品三正文}}</p>
</article>

</body>
</html>

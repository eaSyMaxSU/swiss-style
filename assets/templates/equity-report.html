<!DOCTYPE html>
<!-- EQUITY · ZH · 不要编造价格。缺数写成 [DATA NEEDED: 价格]，并在结尾报告。 Copy this file and swiss.css into the working directory. -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>{{文档标题}}</title>
<meta name="author" content="{{作者}}">
<meta name="description" content="{{摘要}}">
<meta name="keywords" content="{{关键词}}">
<meta name="generator" content="Swiss Style">
<link rel="stylesheet" href="swiss.css">
</head>
<body>

<header class="g">
  <p class="s1 w3 index red">{{代码}}</p>
  <p class="s8 w5 meta">{{地点}}<br>{{日期}}</p>
  <h1 class="s1 w9 display mt-2">{{名称}}</h1>
  <p class="s1 w7 lead mt-2">{{论点}}</p>
</header>
<div class="g mt-3">
  <div class="s1 w3"><p class="figure">{{数字一}}</p><p class="meta mt-1">{{标注一}}</p></div>
  <div class="s4 w3"><p class="figure">{{数字二}}</p><p class="meta mt-1">{{标注二}}</p></div>
  <div class="s7 w3"><p class="figure">{{数字三}}</p><p class="meta mt-1">{{标注三}}</p></div>
</div>
<section class="g band">
  <h2 class="s1 w2 index">01</h2>
  <div class="s3 w8">
    <p class="heading">{{表题}}</p>
    <table class="mt-1">
      <thead><tr><th>{{列一}}</th><th>{{列二}}</th><th>{{列三}}</th></tr></thead>
      <tbody>
        <tr><td>{{格一}}</td><td>{{格二}}</td><td>{{格三}}</td></tr>
        <tr><td>{{格四}}</td><td>{{格五}}</td><td>{{格六}}</td></tr>
      </tbody>
    </table>
    <p class="meta mt-1">{{来源}}</p>
  </div>
</section>
<section class="g band">
  <h2 class="s1 w2 index">02</h2>
  <div class="s3 w7">
    <p class="heading">催化</p>
    <p class="mt-1">{{催化一}}</p>
    <p>{{催化二}}</p>
  </div>
</section>
<section class="g band">
  <h2 class="s1 w2 index">03</h2>
  <div class="s3 w7">
    <p class="heading">风险</p>
    <p class="mt-1">{{风险一}}</p>
    <p>{{风险二}}</p>
  </div>
</section>

</body>
</html>

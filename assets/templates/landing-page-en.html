<!DOCTYPE html>

<html lang="en">
<head>

<title>{{DOC_TITLE}}</title>

<meta name="generator" content="Swiss Style">
<link rel="stylesheet" href="swiss.css">

  <div class="s3 w4 bg-ink h-m mt-2"></div>
  <p class="s8 w4 mt-2">{{WORK_BODY}}</p>
</section>
<section class="g band" id="contact">

  <h2 class="s3 w6 heading">{{CONTACT_HEADING}}</h2>
  <p class="s3 w5 mt-1">{{CONTACT_BODY}}</p>

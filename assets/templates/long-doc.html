<!DOCTYPE html>
<!-- LONG DOC · ZH · 封面加章节。每章复制一节。 Copy this file and swiss.css into the working directory. -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>{{文档标题}}</title>
<meta name="author" content="{{作者}}">
<meta name="description" content="{{摘要}}">
<meta name="keywords" content="{{关键词}}">
<meta name="generator" content="Swiss Style">
<link rel="stylesheet" href="swiss.css">
</head>
<body>

<header class="g">
  <p class="s1 w2 index red">01</p>
  <p class="s9 w4 meta">{{地点}}<br>{{年份}}</p>
  <h1 class="s1 w9 display mt-3">{{标题}}</h1>
  <p class="s1 w7 lead mt-2">{{论点}}</p>
</header>
<div class="g mt-3"><div class="s1 w5 bg-ink h-m"></div></div>
<section class="g band">
  <p class="s1 w2 figure">02</p>
  <h2 class="s3 w7 heading end">{{章一}}</h2>
  <p class="s3 w7 mt-1">{{章一正文}}</p>
  <p class="s3 w7 meta mt-2">{{来源}}</p>
</section>
<section class="g band">
  <p class="s1 w2 figure">03</p>
  <h2 class="s3 w7 heading end">{{章二}}</h2>
  <p class="s3 w7 mt-1">{{章二正文}}</p>
</section>

</body>
</html>

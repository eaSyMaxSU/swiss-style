<!DOCTYPE html>
<!-- LETTER · ZH · 1 页。正文占七栏。 Copy this file and swiss.css into the working directory. -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>{{文档标题}}</title>
<meta name="author" content="{{作者}}">
<meta name="description" content="{{摘要}}">
<meta name="keywords" content="{{关键词}}">
<meta name="generator" content="Swiss Style">
<link rel="stylesheet" href="swiss.css">
</head>
<body>

<header class="g">
  <p class="s1 w4 meta">{{寄件人}}<br>{{联系方式}}</p>
  <p class="s8 w5 meta">{{地点}}<br>{{日期}}</p>
  <h1 class="s1 w8 display m mt-3">{{收件人}}</h1>
  <p class="s1 w7 heading mt-1">{{事由}}</p>
</header>
<div class="g mt-3">
  <p class="s1 w7">{{段落一}}</p>
  <p class="s1 w7 mt-1">{{段落二}}</p>
  <p class="s1 w7 mt-1">{{段落三}}</p>
</div>
<div class="g mt-4">
  <p class="s1 w4">{{结尾}}</p>
  <p class="s1 w5 heading mt-2">{{寄件人}}</p>
</div>

</body>
</html>

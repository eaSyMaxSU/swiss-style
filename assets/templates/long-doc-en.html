<!DOCTYPE html>
<!-- LONG DOC · EN · cover plus chapters. Duplicate a section per chapter. Copy this file and swiss.css into the working directory. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{DOC_TITLE}}</title>
<meta name="author" content="{{AUTHOR}}">
<meta name="description" content="{{DESCRIPTION}}">
<meta name="keywords" content="{{KEYWORDS}}">
<meta name="generator" content="Swiss Style">
<link rel="stylesheet" href="swiss.css">
</head>
<body>

<header class="g">
  <p class="s1 w2 index red">01</p>
  <p class="s9 w4 meta">{{PLACE}}<br>{{YEAR}}</p>
  <h1 class="s1 w9 display mt-3">{{TITLE}}</h1>
  <p class="s1 w7 lead mt-2">{{THESIS}}</p>
</header>
<div class="g mt-3"><div class="s1 w5 bg-ink h-m"></div></div>
<section class="g band">
  <p class="s1 w2 figure">02</p>
  <h2 class="s3 w7 heading end">{{CHAPTER_1}}</h2>
  <p class="s3 w7 mt-1">{{CHAPTER_1_BODY}}</p>
  <p class="s3 w7 meta mt-2">{{SOURCE}}</p>
</section>
<section class="g band">
  <p class="s1 w2 figure">03</p>
  <h2 class="s3 w7 heading end">{{CHAPTER_2}}</h2>
  <p class="s3 w7 mt-1">{{CHAPTER_2_BODY}}</p>
</section>

</body>
</html>

<!DOCTYPE html>
<!-- RESUME · ZH · 2 页。第一页写满后再加 .break。 Copy this file and swiss.css into the working directory. -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>{{文档标题}}</title>
<meta name="author" content="{{作者}}">
<meta name="description" content="{{摘要}}">
<meta name="keywords" content="{{关键词}}">
<meta name="generator" content="Swiss Style">
<link rel="stylesheet" href="swiss.css">
</head>
<body>

<header class="g">
  <p class="s1 w2 index red">01</p>
  <p class="s9 w4 meta">{{地点}}<br>{{年份}}</p>
  <h1 class="s1 w8 display m mt-2">{{姓名}}</h1>
  <p class="s1 w6 heading mt-1">{{职位}}</p>
  <p class="s1 w8 meta mt-1">{{联系方式}}</p>
</header>
<div class="g mt-3"><p class="s1 w7 lead">{{摘要正文}}</p></div>
<article class="g band">
  <p class="s1 w2 index">02</p>
  <h2 class="s3 w5 heading">{{机构一}}</h2>
  <p class="s9 w4 meta">{{开始一}}—{{结束一}}<br>{{地点一}}</p>
  <p class="s3 w7 mt-1">{{角色一}}</p>
  <p class="s3 w8 mt-1">{{要点一甲}}</p>
  <p class="s3 w8">{{要点一乙}}</p>
</article>
<article class="g band">
  <p class="s1 w2 index">03</p>
  <h2 class="s3 w5 heading">{{机构二}}</h2>
  <p class="s9 w4 meta">{{开始二}}—{{结束二}}<br>{{地点二}}</p>
  <p class="s3 w7 mt-1">{{角色二}}</p>
  <p class="s3 w8 mt-1">{{要点二甲}}</p>
  <p class="s3 w8">{{要点二乙}}</p>
</article>
<section class="g band">
  <h2 class="s1 w2 index">04</h2>
  <div class="s3 w8">
    <p class="heading">{{学校}}</p>
    <p class="meta mt-1">{{在读年份}} · {{学校地点}}</p>
    <p class="mt-1">{{学位}}</p>
  </div>
</section>
<section class="g band">
  <h2 class="s1 w2 index">05</h2>
  <p class="s3 w3">{{技能一}}</p>
  <p class="s6 w3">{{技能二}}</p>
  <p class="s9 w3">{{技能三}}</p>
</section>

</body>
</html>

<!DOCTYPE html>
<!-- ONE-PAGER · ZH · 1 页。标题 2–6 个字。 Copy this file and swiss.css into the working directory. -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>{{文档标题}}</title>
<meta name="author" content="{{作者}}">
<meta name="description" content="{{摘要}}">
<meta name="keywords" content="{{关键词}}">
<meta name="generator" content="Swiss Style">
<link rel="stylesheet" href="swiss.css">
</head>
<body>

<header class="g">
  <p class="s1 w2 index red">01</p>
  <p class="s3 w5 meta">{{眉题}}</p>
  <p class="s9 w4 meta">{{地点}}<br>{{年份}}</p>
  <h1 class="s1 w9 display mt-2">{{标题}}</h1>
</header>
<div class="g mt-2"><hr class="s1 w12 rule"></div>
<div class="g mt-2">
  <div class="s1 w3"><p class="figure">{{数字一}}</p><p class="meta mt-1">{{标注一}}</p></div>
  <div class="s4 w3"><p class="figure">{{数字二}}</p><p class="meta mt-1">{{标注二}}</p></div>
  <div class="s7 w3"><p class="figure">{{数字三}}</p><p class="meta mt-1">{{标注三}}</p></div>
  <div class="s10 w3"><p class="figure">{{数字四}}</p><p class="meta mt-1">{{标注四}}</p></div>
</div>
<div class="g mt-3"><p class="s1 w7 lead">{{导语}}</p></div>
<section class="g band">
  <h2 class="s1 w2 index">02</h2>
  <div class="s3 w6"><p class="heading">{{节一}}</p><p class="mt-1">{{节一正文}}</p></div>
</section>
<section class="g mt-2">
  <h2 class="s1 w2 index">03</h2>
  <div class="s3 w6"><p class="heading">{{节二}}</p><p class="mt-1">{{节二正文}}</p></div>
</section>
<div class="g mt-4">
  <p class="s1 w7">{{收束}}</p>
  <p class="s9 w4 meta">{{作者}}</p>
</div>

</body>
</html>

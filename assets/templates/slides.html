<!DOCTYPE html>
<!-- SLIDES · ZH · 一页一个主张。加页就复制 section。 Copy this file and swiss.css into the working directory. -->
<html lang="zh-Hans" class="deck">
<head>
<meta charset="utf-8">
<title>{{文档标题}}</title>
<meta name="author" content="{{作者}}">
<meta name="description" content="{{摘要}}">
<meta name="keywords" content="{{关键词}}">
<meta name="generator" content="Swiss Style">
<link rel="stylesheet" href="swiss.css">
<style>
@page {
  size: 338.67mm 190.5mm;
  margin: 12mm 14mm;
  background: #F4F1EA;
  @bottom-left { content: none; }
}
</style>
</head>
<body>

<section class="slide pack-end">
  <p class="s1 w4 index-xl red">01</p>
  <p class="s8 w5 meta end">{{地点}}<br>{{年份}}</p>
  <h1 class="s1 w9 display">{{标题}}</h1>
</section>
<section class="slide">
  <p class="s1 w2 index red">02</p>
  <h1 class="s3 w10 display m end">{{主张}}</h1>
  <div class="s1 w12 spacer"></div>
  <p class="s1 w6">{{补充}}</p>
</section>
<section class="slide">
  <p class="s1 w2 index">03</p>
  <h1 class="s3 w10 display m end">{{主张二}}</h1>
  <div class="s1 w12 spacer"></div>
  <p class="s1 w1 index">01</p>
  <p class="s2 w6">{{要点一}}</p>
  <p class="s1 w1 index">02</p>
  <p class="s2 w6">{{要点二}}</p>
  <p class="s1 w1 index">03</p>
  <p class="s2 w6">{{要点三}}</p>
</section>

</body>
</html>

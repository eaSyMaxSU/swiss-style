<!DOCTYPE html>
<!-- LANDING · ZH · 只交付 HTML。 Copy this file and swiss.css into the working directory. -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>{{文档标题}}</title>
<meta name="author" content="{{作者}}">
<meta name="description" content="{{摘要}}">
<meta name="keywords" content="{{关键词}}">
<meta name="generator" content="Swiss Style">
<link rel="stylesheet" href="swiss.css">
</head>
<body class="screen">

<header class="g" id="top">
  <nav class="s1 w2">
    <a class="index on" href="#top">01</a>
    <a class="meta" href="#work">02 工作</a>
    <a class="meta" href="#contact">03 联络</a>
  </nav>
  <p class="s10 w3 meta">{{地点}}<br>{{年份}}</p>
  <h1 class="s3 w9 display mt-3">{{名称}}</h1>
  <p class="s3 w6 lead mt-2">{{导语}}</p>
</header>
<section class="g band" id="work">
  <p class="s1 w2 index">02</p>
  <h2 class="s3 w5 heading">{{工作标题}}</h2>
  <div class="s3 w4 bg-ink h-m mt-2"></div>
  <p class="s8 w4 mt-2">{{工作正文}}</p>
</section>
<section class="g band" id="contact">
  <p class="s1 w2 index red">03</p>
  <h2 class="s3 w6 heading">{{联络标题}}</h2>
  <p class="s3 w5 mt-1">{{联络正文}}</p>
</section>

</body>
</html>

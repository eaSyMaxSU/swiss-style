<!DOCTYPE html>
<!-- SLIDES · EN · one assertion per slide. Duplicate a section to add a slide. Copy this file and swiss.css into the working directory. -->
<html lang="en" class="deck">
<head>
<meta charset="utf-8">
<title>{{DOC_TITLE}}</title>
<meta name="author" content="{{AUTHOR}}">
<meta name="description" content="{{DESCRIPTION}}">
<meta name="keywords" content="{{KEYWORDS}}">
<meta name="generator" content="Swiss Style">
<link rel="stylesheet" href="swiss.css">
<style>
@page {
  size: 338.67mm 190.5mm;
  margin: 12mm 14mm;
  background: #F4F1EA;
  @bottom-left { content: none; }
}
</style>
</head>
<body>

<section class="slide pack-end">
  <p class="s1 w4 index-xl red">01</p>
  <p class="s8 w5 meta end">{{PLACE}}<br>{{YEAR}}</p>
  <h1 class="s1 w9 display">{{TITLE}}</h1>
</section>
<section class="slide">
  <p class="s1 w2 index red">02</p>
  <h1 class="s3 w10 display m end">{{ASSERTION}}</h1>
  <div class="s1 w12 spacer"></div>
  <p class="s1 w6">{{SUPPORT}}</p>
</section>
<section class="slide">
  <p class="s1 w2 index">03</p>
  <h1 class="s3 w10 display m end">{{ASSERTION_2}}</h1>
  <div class="s1 w12 spacer"></div>
  <p class="s1 w1 index">01</p>
  <p class="s2 w6">{{POINT_1}}</p>
  <p class="s1 w1 index">02</p>
  <p class="s2 w6">{{POINT_2}}</p>
  <p class="s1 w1 index">03</p>
  <p class="s2 w6">{{POINT_3}}</p>
</section>

</body>
</html>

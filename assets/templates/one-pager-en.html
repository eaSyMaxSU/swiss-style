<!DOCTYPE html>
<!-- ONE-PAGER · EN · 1 page. Title is 1–3 words. Copy this file and swiss.css into the working directory. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{DOC_TITLE}}</title>
<meta name="author" content="{{AUTHOR}}">
<meta name="description" content="{{DESCRIPTION}}">
<meta name="keywords" content="{{KEYWORDS}}">
<meta name="generator" content="Swiss Style">
<link rel="stylesheet" href="swiss.css">
</head>
<body>

<header class="g">
  <p class="s1 w2 index red">01</p>
  <p class="s3 w5 meta">{{KICKER}}</p>
  <p class="s9 w4 meta">{{PLACE}}<br>{{YEAR}}</p>
  <h1 class="s1 w9 display mt-2">{{TITLE}}</h1>
</header>
<div class="g mt-2"><hr class="s1 w12 rule"></div>
<div class="g mt-2">
  <div class="s1 w3"><p class="figure">{{METRIC_1}}</p><p class="meta mt-1">{{METRIC_1_LABEL}}</p></div>
  <div class="s4 w3"><p class="figure">{{METRIC_2}}</p><p class="meta mt-1">{{METRIC_2_LABEL}}</p></div>
  <div class="s7 w3"><p class="figure">{{METRIC_3}}</p><p class="meta mt-1">{{METRIC_3_LABEL}}</p></div>
  <div class="s10 w3"><p class="figure">{{METRIC_4}}</p><p class="meta mt-1">{{METRIC_4_LABEL}}</p></div>
</div>
<div class="g mt-3"><p class="s1 w7 lead">{{LEAD}}</p></div>
<section class="g band">
  <h2 class="s1 w2 index">02</h2>
  <div class="s3 w6"><p class="heading">{{SECTION_1}}</p><p class="mt-1">{{SECTION_1_BODY}}</p></div>
</section>
<section class="g mt-2">
  <h2 class="s1 w2 index">03</h2>
  <div class="s3 w6"><p class="heading">{{SECTION_2}}</p><p class="mt-1">{{SECTION_2_BODY}}</p></div>
</section>
<div class="g mt-4">
  <p class="s1 w7">{{CLOSE}}</p>
  <p class="s9 w4 meta">{{AUTHOR}}</p>
</div>

</body>
</html>
